name: dotnet-dev
services:
  dev:
    build:
      context: .
      args:
        DOTNET_IMAGE: ${DOTNET_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8080}:8080"
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./src:/workspace/src
      - editor-data:/home/developer/.local/share/code-server
      - developer-config:/home/developer/.config
      - nuget-cache:/home/developer/.nuget/packages
      - npm-cache:/home/developer/.npm
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
volumes:
  editor-data:
  developer-config:
  nuget-cache:
  npm-cache:
