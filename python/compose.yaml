name: python-dev
services:
  dev:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.14-slim-bookworm}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8083}:8080"
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
      - "127.0.0.1:${FRONTEND_PORT:-5175}:5173"
    volumes:
      - ./src:/workspace/src
      - editor-data:/home/developer/.local/share/code-server
      - developer-config:/home/developer/.config
      - pip-cache:/home/developer/.cache/pip
      - uv-cache:/home/developer/.cache/uv
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
volumes:
  editor-data:
  developer-config:
  pip-cache:
  uv-cache:
