name: nodejs-dev
services:
  dev:
    build:
      context: .
      additional_contexts:
        dev_common: ../common
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:26-bookworm}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    environment:
      EDITOR_MODE: ${EDITOR_MODE:-browser}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8086}:8080"
      - "127.0.0.1:${WEB_PORT:-3000}:8000"
      - "127.0.0.1:${FRONTEND_PORT:-5178}:5173"
    volumes:
      - ./src:/workspace/src
      - editor-data:/home/developer/.local/share/code-server
      - developer-config:/home/developer/.config
      - opencode-data:/home/developer/.local/share/opencode
      - pip-cache:/home/developer/.cache/pip
      - uv-cache:/home/developer/.cache/uv
      - npm-cache:/home/developer/.npm
      - pnpm-cache:/home/developer/.local/share/pnpm/store
      - yarn-cache:/home/developer/.cache/yarn
    healthcheck:
      test: ["CMD", "/usr/local/bin/dev-entrypoint", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
volumes:
  editor-data:
  developer-config:
  opencode-data:
  pip-cache:
  uv-cache:
  npm-cache:
  pnpm-cache:
  yarn-cache:
