name: go-dev
services:
  dev:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-golang:1.27-bookworm}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8085}:8080"
      - "127.0.0.1:${WEB_PORT:-8002}:8000"
      - "127.0.0.1:${FRONTEND_PORT:-5177}:5173"
    cap_add:
      - SYS_PTRACE
    volumes:
      - ./src:/workspace/src
      - editor-data:/home/developer/.local/share/code-server
      - developer-config:/home/developer/.config
      - go-modules:/home/developer/go/pkg/mod
      - go-build:/home/developer/.cache/go-build
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
volumes:
  editor-data:
  developer-config:
  go-modules:
  go-build:
