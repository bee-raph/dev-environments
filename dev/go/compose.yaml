name: go-dev
services:
  dev:
    build:
      context: .
      additional_contexts:
        dev_common: ../common
      args:
        BASE_IMAGE: ${BASE_IMAGE:-golang:1.27-bookworm}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    environment:
      EDITOR_MODE: ${EDITOR_MODE:-browser}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8085}:8080"
      - "127.0.0.1:${WEB_PORT:-8002}:8000"
      - "127.0.0.1:${FRONTEND_PORT:-5177}:5173"
    cap_add:
      - SYS_PTRACE
    volumes:
      - ./src:/workspace/src
      - editor-data:/home/developer/.local/share/code-server
      - developer-config:/home/developer/.config
      - opencode-data:/home/developer/.local/share/opencode
      - pip-cache:/home/developer/.cache/pip
      - uv-cache:/home/developer/.cache/uv
      - go-modules:/home/developer/go/pkg/mod
      - go-build:/home/developer/.cache/go-build
    healthcheck:
      test: ["CMD", "/usr/local/bin/dev-entrypoint", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
volumes:
  editor-data:
  developer-config:
  opencode-data:
  pip-cache:
  uv-cache:
  go-modules:
  go-build:
