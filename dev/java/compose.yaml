name: java-dev
services:
  dev:
    build:
      context: .
      additional_contexts:
        dev_common: ../common
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:27-jdk}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9.16}
        GRADLE_VERSION: ${GRADLE_VERSION:-9.8.1}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8082}:8080"
      - "127.0.0.1:${WEB_PORT:-8081}:8081"
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5173"
      - "127.0.0.1:${DEBUG_PORT:-5005}:5005"
    environment:
      EDITOR_MODE: ${EDITOR_MODE:-browser}
      SERVER_PORT: "8081"
      SERVER_ADDRESS: "0.0.0.0"
    volumes:
      - ./src:/workspace/src
      - editor-data:/home/developer/.local/share/code-server
      - developer-config:/home/developer/.config
      - opencode-data:/home/developer/.local/share/opencode
      - pip-cache:/home/developer/.cache/pip
      - uv-cache:/home/developer/.cache/uv
      - maven-cache:/home/developer/.m2
      - gradle-cache:/home/developer/.gradle
      - npm-cache:/home/developer/.npm
    healthcheck:
      test: ["CMD", "/usr/local/bin/dev-entrypoint", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
volumes:
  editor-data:
  developer-config:
  opencode-data:
  pip-cache:
  uv-cache:
  maven-cache:
  gradle-cache:
  npm-cache:
