name: java-dev
services:
  dev:
    build:
      context: .
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:27-jdk}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9.16}
        GRADLE_VERSION: ${GRADLE_VERSION:-9.8.1}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8082}:8080"
      - "127.0.0.1:${WEB_PORT:-8081}:8081"
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5173"
      - "127.0.0.1:${DEBUG_PORT:-5005}:5005"
    environment:
      SERVER_PORT: "8081"
      SERVER_ADDRESS: "0.0.0.0"
    volumes:
      - ./src:/workspace/src
      - editor-data:/home/developer/.local/share/code-server
      - developer-config:/home/developer/.config
      - maven-cache:/home/developer/.m2
      - gradle-cache:/home/developer/.gradle
      - npm-cache:/home/developer/.npm
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
volumes:
  editor-data:
  developer-config:
  maven-cache:
  gradle-cache:
  npm-cache:
