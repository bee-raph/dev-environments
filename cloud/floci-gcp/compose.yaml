name: floci-gcp-service
services:
  floci-gcp:
    image: ${SERVICE_IMAGE:-floci/floci-gcp:latest}
    ports:
      - "127.0.0.1:${SERVICE_PORT:-4588}:4588"
    environment:
      FLOCI_GCP_STORAGE_MODE: persistent
      FLOCI_GCP_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_GCP_SERVICES_DOCKER_NETWORK: dev-services
      FLOCI_GCP_DOCKER_RESOURCE_NAMESPACE: floci-gcp
      FLOCI_GCP_BASE_URL: http://localhost:${SERVICE_PORT:-4588}
      FLOCI_GCP_DEFAULT_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT:-developer-local}
    volumes:
      - data:/app/data
    networks:
      services:
        aliases: [floci-gcp]
    restart: unless-stopped
volumes:
  data:
networks:
  services:
    external: true
    name: dev-services
