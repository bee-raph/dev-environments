name: floci-azure-service
services:
  floci-azure:
    image: ${SERVICE_IMAGE:-floci/floci-az:latest}
    ports:
      - "127.0.0.1:${SERVICE_PORT:-4577}:4577"
    environment:
      FLOCI_AZ_STORAGE_MODE: persistent
      FLOCI_AZ_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_AZ_SERVICES_DOCKER_NETWORK: dev-services
      FLOCI_AZ_DOCKER_RESOURCE_NAMESPACE: floci-azure
      FLOCI_AZ_BASE_URL: http://localhost:${SERVICE_PORT:-4577}
    volumes:
      - data:/app/data
    networks:
      services:
        aliases: [floci-azure]
    restart: unless-stopped
volumes:
  data:
networks:
  services:
    external: true
    name: dev-services
